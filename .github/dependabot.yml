version: 2
updates:
  # npm — the AWS SDK packages version in lockstep and publish almost daily, so
  # they MUST be grouped (and updated weekly, not daily) or they flood the PR
  # queue. @smithy/* is the same release train and shares the transitive
  # @smithy/core pin, so ungrouping it means every PR rewrites the same lockfile
  # block and they conflict pairwise. Dev deps grouped too; CI (lint + 3-OS
  # test) gates every PR.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      aws-sdk:
        patterns: ["@aws-sdk/*", "@smithy/*"]
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5

  # GitHub Actions — keeps the pinned actions/* and setup-node in ci.yml /
  # release.yml current (supply-chain surface + avoids deprecated runner images).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
