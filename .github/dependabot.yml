version: 2
updates:
  # npm — the AWS SDK packages version in lockstep and publish almost daily, so
  # they MUST be grouped (and updated weekly, not daily) or they flood the PR
  # queue. @smithy/* is the same release train and shares the transitive
  # @smithy/core pin, so ungrouping it means every PR rewrites the same lockfile
  # block and they conflict pairwise. Dev deps grouped too; CI (lint + 3-OS
  # test) gates every PR.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      aws-sdk:
        patterns: ["@aws-sdk/*", "@smithy/*"]
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5

  # GitHub Actions — keeps every workflow's `uses:` current: the actions/* ones ride
  # a major tag, aws-actions/configure-aws-credentials a commit SHA whose `# vX.Y.Z`
  # comment Dependabot bumps alongside it. Supply-chain surface; it does not touch
  # `runs-on` labels, so a retiring runner image is found by hand.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
