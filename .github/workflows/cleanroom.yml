# A clean-room session on a hosted runner (proposals/cleanroom-ci.md): build the sandbox,
# run the headless session in it, check and audit it, and upload the clean room.
#
# Dispatch it from main only (`gh workflow run cleanroom.yml --ref main`): the s3cab-ci
# role trusts main's OIDC subject, so a run from any other branch fails at the
# assume-role. Download the artifact as soon as the run ends, then delete it.
#
# On macOS and Linux the session runs inside Claude Code's shell sandbox
# (session-settings.json), which hides the home folder (the checkout, RUNNER_TEMP) and
# reaches no host but AWS, and with an emptied environment, so none of the job's variables
# reach it: only the paths it needs, the user's name and the Claude token, the one secret
# its shell inherits. Windows has no shell sandbox, so there the emptied environment
# (windows-session.ps1) and the transcript audit are the walls, as at home.

name: cleanroom

on:
  workflow_dispatch:
    inputs:
      role:
        type: choice
        options: [backup, restore]
      platform:
        type: choice
        options: [macos, linux, windows]
      model:
        type: string
        default: claude-opus-5-5
      effort:
        type: choice
        options: [low, medium, high, xhigh, max]
        default: low

permissions:
  contents: read

# Backup runs take turns emptying the one bucket. `queue: max`, or a third dispatch
# cancels the second, which is still pending. Restore runs only read theirs, so each is
# a group of its own.
concurrency:
  group: cleanroom-${{ inputs.role == 'backup' && 'backup' || github.run_id }}
  cancel-in-progress: false
  queue: max

env:
  # Match ci.yml: pin to the engines floor.
  NODE_VERSION: "26.10.0"
  CLAUDE_CODE_VERSION: "2.1.301"
  ROLE: ${{ inputs.role }}
  S3CAB_TEST_BUCKET_CLEANROOM_BACKUP: ${{ vars.S3CAB_TEST_BUCKET_CLEANROOM_BACKUP }}
  S3CAB_TEST_BUCKET_CLEANROOM_RESTORE: ${{ vars.S3CAB_TEST_BUCKET_CLEANROOM_RESTORE }}
  # The role's bucket, the one the clean room's keys reach. Tested for restore, so an unset
  # variable falls through to the bucket a backup run empties, never to the restore fixtures.
  BUCKET: ${{ inputs.role == 'restore' && vars.S3CAB_TEST_BUCKET_CLEANROOM_RESTORE || vars.S3CAB_TEST_BUCKET_CLEANROOM_BACKUP }}
  # Outside the home folder and temp, which the transcript audit watches: cleanroom.mjs's
  # exampleRoot for each platform. Windows' with forward slashes, which both Git Bash and
  # Node read.
  SANDBOX: ${{ inputs.platform == 'windows' && 'C:/s3cab.sandbox' || inputs.platform == 'linux' && '/srv/s3cab.sandbox' || '/Users/Shared/s3cab.sandbox' }}

defaults:
  run:
    shell: bash # -eo pipefail, so a `| tee` keeps the checker's exit

jobs:
  run:
    name: ${{ inputs.role }} on ${{ inputs.platform }} (${{ inputs.model }}, ${{ inputs.effort }})
    # The seed's runners, cleanroom-seed.yml's.
    runs-on: ${{ fromJSON('{"macos":"macos-15","linux":"ubuntu-latest","windows":"windows-latest"}')[inputs.platform] }}
    timeout-minutes: 360 # GitHub's ceiling for a hosted job
    permissions:
      id-token: write # mint the OIDC token for the AWS assume-role
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      # Taken before the assume-role, so it errs early. The SDK reads it as the keys'
      # expiry, and the build writes it into ENVIRONMENT.md; configure-aws-credentials
      # exports none.
      - run: echo "AWS_CREDENTIAL_EXPIRATION=$(node -p 'new Date(Date.now() + 6 * 3600e3).toISOString().slice(0, 19) + "Z"')" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1 # both clean-room buckets' region
          role-duration-seconds: 21600 # the s3cab-ci role's MaxSessionDuration
          # These keys go into the clean room: the role's bucket alone, not every
          # test-s3cab-ci-* bucket the role reaches, and the restore bucket read-only.
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow",
            "Action":${{ inputs.role == 'backup' && '"s3:*"' || '["s3:Get*","s3:List*"]' }},
            "Resource":["arn:aws:s3:::${{ env.BUCKET }}","arn:aws:s3:::${{ env.BUCKET }}/*"]}]}
      - if: inputs.role == 'backup'
        run: aws s3 rm "s3://$BUCKET/" --recursive
      # A backup clean room's Python: outside the home folder, which the sandbox hides
      # from the session's python3.
      - if: inputs.role == 'backup' && inputs.platform == 'macos'
        run: /opt/homebrew/bin/python3 -m pip install --break-system-packages boto3
      - if: inputs.role == 'backup' && inputs.platform == 'linux'
        run: sudo python3 -m pip install --break-system-packages boto3 # as root: /usr/local
      - if: inputs.role == 'backup' && inputs.platform == 'windows'
        run: python -m pip install boto3 # into the tool cache's Python, outside the home folder
      # Claude Code's shell sandbox runs commands in bwrap with socat as its proxy, and
      # Ubuntu 24.04 refuses bwrap an unprivileged user namespace by default. The sandbox
      # root is one only root can make.
      - if: inputs.platform == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo install -d -o "$USER" "$SANDBOX"
      - run: npm install --global "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
      - if: inputs.platform == 'windows'
        run: cp scripts/cleanroom/windows-session.ps1 "$RUNNER_TEMP/"
      - run: node "scripts/cleanroom/build-$ROLE-cleanroom.mjs" "$SANDBOX"

      - name: delete the checkout and the npm cache
        working-directory: ${{ runner.temp }} # Windows won't delete a step's own folder
        run: |
          rm -rf "$GITHUB_WORKSPACE" "$(npm config get cache)"
          mkdir "$GITHUB_WORKSPACE"

      # A restore's two phases share the 300 minutes a backup's one has, which leave the
      # checks and the upload time to run.
      - name: session
        if: inputs.platform != 'windows'
        timeout-minutes: ${{ inputs.role == 'restore' && 200 || 300 }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
        working-directory: ${{ env.SANDBOX }}/cleanroom
        run: |
          session_id=$(uuidgen | tr '[:upper:]' '[:lower:]')
          echo "SESSION_ID=$session_id" >> "$GITHUB_ENV"
          # Without USER and LOGNAME the session's shell reads LOGNAME as root, not runner,
          # and Python's getpass.getuser() with it. Linux runners leave TMPDIR unset, which
          # passed as is would be set and empty.
          user=$(id -un)
          fixtures=()
          if [ "$ROLE" = backup ]; then fixtures=(--add-dir ../fixtures); fi
          env -i HOME="$HOME" TMPDIR="${TMPDIR:-/tmp}" USER="$user" LOGNAME="$user" \
            PATH="/opt/homebrew/bin:$(dirname "$(command -v node)"):/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN" \
            claude -p --restricted --tools Bash,Read,Write,Edit,Glob,Grep,TaskStop \
              --settings ../session-settings.json "${fixtures[@]}" \
              --safe-mode --append-system-prompt-file CLAUDE.md --session-id "$session_id" \
              --model "$MODEL" --effort "$EFFORT" --permission-mode auto --max-budget-usd 30 go \
            > ../session.log 2>&1
      # The tool list quoted: unquoted, PowerShell reads it as an array and passes it on
      # space-separated.
      - name: session
        if: inputs.platform == 'windows'
        timeout-minutes: ${{ inputs.role == 'restore' && 200 || 300 }}
        shell: pwsh
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
        working-directory: ${{ env.SANDBOX }}/cleanroom
        run: |
          $sessionId = [guid]::NewGuid().ToString()
          "SESSION_ID=$sessionId" >> $env:GITHUB_ENV
          $fixtures = $env:ROLE -eq 'backup' ? @('--add-dir', '../fixtures') : @()
          & "$env:RUNNER_TEMP/windows-session.ps1" -Log ../session.log -- -p --restricted `
            --tools 'PowerShell,Read,Write,Edit,Glob,Grep,TaskStop' `
            --settings ../session-settings.json @fixtures `
            --safe-mode --append-system-prompt-file CLAUDE.md --session-id $sessionId `
            --model $env:MODEL --effort $env:EFFORT --permission-mode auto --max-budget-usd 30 go

      # A restore's references are built only now, from a second checkout, so none existed
      # while the spec-only phase ran: even after one that failed, so its restorer is still
      # checked. The checkout goes again before the session resumes.
      - if: always() && inputs.role == 'restore'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: always() && inputs.role == 'restore'
        run: npm ci
      - if: always() && inputs.role == 'restore'
        run: node scripts/cleanroom/reconcile-restore-cleanroom.mjs "$SANDBOX"
      - name: delete the checkout and the npm cache again
        if: inputs.role == 'restore'
        working-directory: ${{ runner.temp }}
        run: |
          rm -rf "$GITHUB_WORKSPACE" "$(npm config get cache)"
          mkdir "$GITHUB_WORKSPACE"
      - name: session, reconcile phase
        if: inputs.role == 'restore' && inputs.platform != 'windows'
        timeout-minutes: 100
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
        working-directory: ${{ env.SANDBOX }}/cleanroom
        run: |
          user=$(id -un)
          env -i HOME="$HOME" TMPDIR="${TMPDIR:-/tmp}" USER="$user" LOGNAME="$user" \
            PATH="/opt/homebrew/bin:$(dirname "$(command -v node)"):/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            CLAUDE_CODE_OAUTH_TOKEN="$CLAUDE_CODE_OAUTH_TOKEN" \
            claude -p --restricted --tools Bash,Read,Write,Edit,Glob,Grep,TaskStop \
              --settings ../session-settings.json \
              --safe-mode --append-system-prompt-file CLAUDE.md --resume "$SESSION_ID" \
              --model "$MODEL" --effort "$EFFORT" --permission-mode auto --max-budget-usd 30 \
              "read RECONCILE.md" \
            > ../session-reconcile.log 2>&1
      - name: session, reconcile phase
        if: inputs.role == 'restore' && inputs.platform == 'windows'
        timeout-minutes: 100
        shell: pwsh
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
        working-directory: ${{ env.SANDBOX }}/cleanroom
        run: |
          & "$env:RUNNER_TEMP/windows-session.ps1" -Log ../session-reconcile.log -- -p --restricted `
            --tools 'PowerShell,Read,Write,Edit,Glob,Grep,TaskStop' `
            --settings ../session-settings.json `
            --safe-mode --append-system-prompt-file CLAUDE.md --resume $env:SESSION_ID `
            --model $env:MODEL --effort $env:EFFORT --permission-mode auto --max-budget-usd 30 `
            'read RECONCILE.md'

      # The checkers run s3cab at the commit under test.
      - if: always()
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: always()
        run: npm ci
      - name: check
        if: always()
        timeout-minutes: 40 # leaves the audit and the upload time to run
        run: |
          # check-restore runs the session's restorer outside the sandbox, with this
          # step's environment: a restorer that prints it would put these, which mint an
          # OIDC token for s3cab-ci, into check.txt. Not a wall against a restorer that sets
          # out to escape: the session reads only the brief and the spec, so a leak is an
          # accident, not an attack.
          unset ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN
          # Into the file, not through tee: off Windows, Node doesn't wait on a pipe, so a
          # check killed at the step limit would lose what it had printed but not yet sent.
          node "scripts/cleanroom/check-$ROLE.mjs" "$SANDBOX" > "$SANDBOX/cleanroom/check.txt" || status=$?
          cat "$SANDBOX/cleanroom/check.txt"
          exit "${status:-0}"
      - name: audit
        if: always()
        run: node scripts/cleanroom/audit-transcript.mjs "$SANDBOX" | tee "$SANDBOX/cleanroom/audit.txt"

      - name: gather
        if: always()
        run: |
          rm -f "$SANDBOX"/cleanroom/credentials.*
          mkdir -p "$RUNNER_TEMP/keep"
          cp -R "$SANDBOX/cleanroom" "$SANDBOX"/session*.log "$RUNNER_TEMP/keep/"
          if [ -d "$SANDBOX/spec-only" ]; then cp -R "$SANDBOX/spec-only" "$RUNNER_TEMP/keep/"; fi
          cp ~/.claude/projects/*/"$SESSION_ID.jsonl" "$RUNNER_TEMP/keep/"
      # The artifact is public: refuse it if any of the job's secrets is in it. The AWS
      # keys are replaced first, since the session is handed them and may well print
      # them; they reach only the role's bucket, and not for long. Nothing hands the
      # session the other two.
      - name: search for secrets
        id: search
        if: always()
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          secrets="CLAUDE_CODE_OAUTH_TOKEN AWS_ROLE_ARN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN"
          for secret in $secrets; do
            # An empty value would match every file.
            [ -n "${!secret}" ] || { echo "$secret is empty, so it can't be searched for"; exit 1; }
          done
          for secret in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do
            # perl's \Q, because a secret key holds `/` and `+`. `|| true`: grep exits 1
            # on no match, which pipefail would make the step's failure.
            { grep -rlF -- "${!secret}" "$RUNNER_TEMP/keep" || true; } | while IFS= read -r file; do
              VALUE="${!secret}" NAME="$secret" perl -pi -e 's/\Q$ENV{VALUE}\E/<$ENV{NAME}>/g' "$file"
            done
          done
          for secret in $secrets; do
            if grep -rqF -- "${!secret}" "$RUNNER_TEMP/keep"; then
              echo "$secret is in the clean room or its transcript: not uploading it"
              exit 1
            fi
          done
      # One file, not the tree: upload-artifact refuses a path holding " : < > | * ?, and
      # a restore's trees hold the edge set's names with them. Relative paths, since GNU
      # tar reads Windows' `D:\a\_temp` as a host `D`.
      - if: always() && steps.search.outcome == 'success'
        working-directory: ${{ runner.temp }}
        run: tar -czf cleanroom.tgz -C keep .
      # Even when the check or the audit failed: that run is the one worth reading.
      - if: always() && steps.search.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: cleanroom-${{ inputs.role }}-${{ inputs.platform }}-${{ inputs.model }}-${{ inputs.effort }}
          path: ${{ runner.temp }}/cleanroom.tgz
          retention-days: 1 # GitHub's minimum; delete it as soon as it's downloaded
