# Build native s3cab executables on each platform's own runner and publish them,
# plus a portable single-file Node bundle (dist/s3cab.js) as an any-platform asset.
#
# Design: build NATIVELY per runner rather than cross-compiling. Each runner's own
# node both produces the SEA blob and is the base binary, so the "same version"
# rule is satisfied by construction — and the macOS runner can sign with the real
# `codesign` (which only exists on macOS). Each job just runs `--build-sea` against
# its platform's static config in sea/ (no script, no download — setup-node provides
# the node, and an omitted `executable` defaults to that running node).
#
# Triggers: a `v*` tag (cuts a GitHub Release) or manual dispatch (artifacts only).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege by default: jobs are read-only unless they opt in. The release
# job overrides this with `contents: write` to create the release + upload assets.
permissions:
  contents: read

# Serialize releases for a given ref. Unlike ci.yml, do NOT cancel in-progress —
# interrupting a half-finished publish (a created Release, or an npm publish mid-flight)
# is worse than letting it complete; tags are rare enough that queueing is fine.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pin to the engines floor so release artifacts are reproducible. setup-node and
  # --build-sea use the same node, so host == target version automatically.
  NODE_VERSION: "26.3.0"

jobs:
  # Re-gate the tagged commit (the one commit ci.yml never sees). Mirrors ci.yml's
  # lint job checks — lint + format + typecheck — plus the test suite, single-OS.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      # Don't ship a binary with a known high-severity advisory in it. This gate
      # exists for the SEA executables and the portable bundle specifically: they are
      # built with `npm ci`, so they freeze this lockfile FOREVER — an installed
      # binary has no float and cannot be reached, and the only fix is cutting
      # another release. (The npm tarball is the opposite: carets, no published
      # lockfile, so its users resolve past a bad version on their own.)
      #
      # `--omit=dev` on purpose: esbuild/eslint/prettier advisories never reach a
      # user, and a gate that cries wolf is a gate people learn to skip.
      #
      # If an advisory with no available fix ever blocks an urgent release, that is a
      # judgement call to make in the open — raise the level or drop the step in a
      # commit that says why, rather than quietly weakening it here.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  build:
    needs: verify
    runs-on: ${{ matrix.runner }}
    permissions:
      id-token: write # mint the OIDC token for the gated real-S3 round-trip's assume-role
      contents: read
    strategy:
      fail-fast: false
      # `bin` is the built executable name (it's plain `s3cab[.exe]` on every
      # platform — see sea/<target>.json); `archive` is the per-platform release
      # asset wrapping that bare binary, so the four downloads don't collide.
      matrix:
        include:
          # Linux: build on the OLDEST supported ubuntu, not `-latest`. A native
          # binary links against the builder's glibc, so building on 24.04 (glibc
          # 2.39) would refuse to start on anything older with `GLIBC_2.3x not
          # found`. 22.04 (glibc 2.35) widens the floor while still satisfying
          # Node 26's own glibc requirement. (The test/release jobs stay on
          # `-latest` — glibc only matters for the artifact we ship.)
          - {
              target: linux-x64,
              runner: ubuntu-22.04,
              bin: s3cab,
              archive: s3cab-linux-x64.tar.gz,
            }
          # GitHub-hosted arm64 Linux runner (public repos), same glibc reasoning.
          - {
              target: linux-arm64,
              runner: ubuntu-22.04-arm,
              bin: s3cab,
              archive: s3cab-linux-arm64.tar.gz,
            }
          # macos-14 is Apple Silicon (arm64). We label the target `macos` rather than
          # the platform's `darwin` — friendlier on a download (the e2e test maps back).
          - {
              target: macos-arm64,
              runner: macos-14,
              bin: s3cab,
              archive: s3cab-macos-arm64.tar.gz,
            }
          - {
              target: win-x64,
              runner: windows-latest,
              bin: s3cab.exe,
              archive: s3cab-win-x64.zip,
            }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci

      - name: Build native SEA executable
        run: |
          npm run build
          node --build-sea=sea/${{ matrix.target }}.json

      # Ad-hoc codesign so the binary launches on Apple Silicon (which refuses
      # unsigned binaries). NOTE: ad-hoc signing is enough to RUN, but not to
      # distribute past Gatekeeper — that needs a Developer ID cert + notarization
      # (set up later via secrets; see CLAUDE.md known gaps).
      - name: Codesign (macOS, ad-hoc)
        if: runner.os == 'macOS'
        run: codesign --force --sign - "dist/${{ matrix.bin }}"

      # Smoke-test the freshly built binary on its native runner. Keep these in step
      # with ci.yml's `exe smoke` job, and use commands that need no configured set:
      # `--version` proves the binary boots + the inlined version, `prop` does real
      # file I/O. (`list` errors without a set since backup-sets — see #78.)
      - name: Smoke test
        shell: bash
        run: |
          ./dist/${{ matrix.bin }} --version
          ./dist/${{ matrix.bin }} prop package.json

      # Assume the test role via OIDC for the gated round-trip below. Gated on the
      # bucket var (mirrors ci.yml's s3-integration) — NOT the test-runner hard-fail
      # — so a no-cred dispatch or fork still builds and ships artifacts; only the
      # extra ship-gate assertion is skipped when there's no bucket.
      - name: Configure AWS credentials (gated real-S3 round-trip)
        if: vars.S3CAB_TEST_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1 # the test bucket's region; exported as AWS_REGION

      # The per-platform ship-gate: drive the freshly built binary through a full
      # setup → backup → wipe → restore against the real test bucket, on THIS OS,
      # asserting byte-identical recovery. It upgrades the smoke test above from "the
      # binary boots" to "the binary actually backs up and restores here" — the check
      # that closes the standing gap where no tier did a real S3 round-trip on Windows
      # or macOS (sockets/IOCP-vs-epoll, rename-over-open-file, AV locks all diverge by
      # platform; #171 was a real per-platform stream-teardown bug the mocks all
      # passed). Content is unique per platform per run, so concurrent matrix legs never
      # collide in the shared objects/ store; the bucket's ~1-day lifecycle auto-expiry
      # sweeps it (docs/design/testing.md). Runs on both v* tags and workflow_dispatch,
      # so the whole matrix can be dry-run on demand and tagged only once green.
      - name: Real-S3 backup → restore round-trip (gated)
        if: vars.S3CAB_TEST_BUCKET != ''
        shell: bash
        env:
          S3CAB_TEST_BUCKET: ${{ vars.S3CAB_TEST_BUCKET }}
        run: |
          set -euo pipefail
          # Paths stay RELATIVE to the workspace (cwd). On the Windows runner the
          # binary is native but the shell is Git Bash, and MSYS rewrites POSIX
          # *arguments* to Windows paths but NOT env-var *values* — so an absolute
          # `mktemp -d` (`/tmp/…`) in S3CAB_HOME would reach the exe unconverted and
          # resolve wrong. Relative paths dodge all that (the smoke test above already
          # drives the exe with a relative arg).
          bin="./dist/${{ matrix.bin }}"
          export S3CAB_HOME=".s3cab-rt" # isolate the set store from ~/.s3cab
          src="rt-src"
          mkdir -p "$src/nested"
          # Unique content per platform per run → unique object hashes, so concurrent
          # matrix legs never collide in the shared objects/ store.
          stamp="${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}"
          a="top-level $stamp"
          b="nested $stamp"
          printf '%s' "$a" >"$src/file-a.txt"
          printf '%s' "$b" >"$src/nested/file-b.txt"
          setname="rt-$stamp" # [a-z0-9-]+: a valid set name
          "$bin" setup --set "$setname" "$src" --bucket "$S3CAB_TEST_BUCKET"
          "$bin" backup "$setname"
          # The content now lives only in S3: wipe the originals, then restore.
          rm -rf "$src"
          "$bin" restore --set "$setname"
          # Byte-identical recovery — the assertion this whole job exists for.
          got_a="$(cat "$src/file-a.txt")"
          got_b="$(cat "$src/nested/file-b.txt")"
          [ "$got_a" = "$a" ] || { echo "::error::file-a mismatch: '$got_a' != '$a'"; exit 1; }
          [ "$got_b" = "$b" ] || { echo "::error::file-b mismatch: '$got_b' != '$b'"; exit 1; }
          echo "round-trip OK on ${{ matrix.target }}"

      # Wrap the bare `s3cab[.exe]` in a per-platform archive for release: tar.gz
      # everywhere except Windows (zip, more native there). `-C dist` keeps the
      # archive flat — it contains just the binary, no `dist/` prefix.
      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.archive }}" -C dist "${{ matrix.bin }}"
      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/${{ matrix.bin }}" -DestinationPath "${{ matrix.archive }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  # The portable, bring-your-own-Node distribution: the same esbuild bundle that
  # feeds SEA (dist/s3cab.js), shipped as a single ESM file. It runs on any platform
  # that has Node (no per-OS binary), is built once (platform-independent), and needs
  # no archive — it's a tiny self-contained script with a `#!/usr/bin/env node`
  # shebang, so on unix it's directly executable. Parallel channel to the npm package
  # and the native binaries.
  bundle:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run build

      - name: Smoke test
        run: node dist/s3cab.js --version

      - uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: dist/s3cab.js
          if-no-files-found: error

  release:
    needs: [build, bundle]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload assets
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Ship a checksums file alongside the binaries so downloads are verifiable
      # — fitting for a tool whose whole premise is SHA-256 content addressing.
      # `*` is expanded before SHA256SUMS is created, so it never hashes itself.
      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          # Mark pre-1.0 (v0.x) or semver-prerelease (v1.2.3-alpha.1) tags as prerelease
          # so they don't show as "Latest" in the Releases UI.
          prerelease=
          case "$tag" in
            v0.* | *-*) prerelease=--prerelease ;;
          esac
          gh release create "$tag" artifacts/* \
            --repo "${{ github.repository }}" \
            --generate-notes \
            $prerelease

  # Publish the npm package (source, not the binary — see CLAUDE.md "npm package").
  # Runs in parallel with `release`, both gated on a v* tag and on `build` passing.
  publish-npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC, so `npm publish --provenance` can attest the build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org # sets up auth from NODE_AUTH_TOKEN

      # The git tag is the source of truth for the version; fail fast and clearly
      # if package.json disagrees (npm would otherwise reject it late, or publish
      # the wrong number). Strips the leading `v`: v0.0.1 -> 0.0.1.
      - name: Tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          test "$tag" = "$pkg" || { echo "tag v$tag != package.json $pkg" >&2; exit 1; }

      # Trusted Publishing: npm authenticates to the registry via THIS job's OIDC
      # token (id-token: write) — no long-lived NPM_TOKEN secret. Requires a
      # trusted publisher configured for the `s3cab` package on npmjs.com
      # (publisher: GitHub Actions, repo allens/s3cab, workflow release.yml).
      # OIDC trusted publishing needs npm >= 11.5.1, so refresh npm first (Node's
      # bundled npm may predate it). Provenance is generated automatically.
      - name: Update npm (for OIDC trusted publishing)
        run: npm install -g npm@latest

      # No build/prepack: we publish the source tree (the `files` allowlist). The
      # dist-tag deliberately differs from the GitHub-release prerelease rule —
      # only a semver-prerelease tag (v0.0.2-alpha.1) goes to `next`; a plain v0.x
      # publishes to `latest` (the default `npm install`).
      - name: Publish
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*) disttag=next ;;
            *) disttag=latest ;;
          esac
          npm publish --provenance --access public --tag "$disttag"
