# Build native s3cab executables on each platform's own runner and publish them.
#
# Design: build NATIVELY per runner rather than cross-compiling. Each runner's own
# node both produces the SEA blob and is the base binary, so the "same version"
# rule is satisfied by construction — and the macOS runner can sign with the real
# `codesign` (which only exists on macOS). Each job just runs `--build-sea` against
# its platform's static config in sea/ (no script, no download — setup-node provides
# the node, and an omitted `executable` defaults to that running node).
#
# Triggers: a `v*` tag (cuts a GitHub Release) or manual dispatch (artifacts only).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege by default: jobs are read-only unless they opt in. The release
# job overrides this with `contents: write` to create the release + upload assets.
permissions:
  contents: read

env:
  # Pin to the engines floor so release artifacts are reproducible. setup-node and
  # --build-sea use the same node, so host == target version automatically.
  NODE_VERSION: "26.3.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # `bin` is the built executable name (it's plain `s3cab[.exe]` on every
      # platform — see sea/<target>.json); `archive` is the per-platform release
      # asset wrapping that bare binary, so the four downloads don't collide.
      matrix:
        include:
          # Linux: build on the OLDEST supported ubuntu, not `-latest`. A native
          # binary links against the builder's glibc, so building on 24.04 (glibc
          # 2.39) would refuse to start on anything older with `GLIBC_2.3x not
          # found`. 22.04 (glibc 2.35) widens the floor while still satisfying
          # Node 26's own glibc requirement. (The test/release jobs stay on
          # `-latest` — glibc only matters for the artifact we ship.)
          - {
              target: linux-x64,
              runner: ubuntu-22.04,
              bin: s3cab,
              archive: s3cab-linux-x64.tar.gz,
            }
          # GitHub-hosted arm64 Linux runner (public repos), same glibc reasoning.
          - {
              target: linux-arm64,
              runner: ubuntu-22.04-arm,
              bin: s3cab,
              archive: s3cab-linux-arm64.tar.gz,
            }
          # macos-14 is Apple Silicon (arm64).
          - {
              target: darwin-arm64,
              runner: macos-14,
              bin: s3cab,
              archive: s3cab-darwin-arm64.tar.gz,
            }
          - {
              target: win-x64,
              runner: windows-latest,
              bin: s3cab.exe,
              archive: s3cab-win-x64.zip,
            }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci

      - name: Build native SEA executable
        run: |
          npm run build
          node --build-sea=sea/${{ matrix.target }}.json

      # Ad-hoc codesign so the binary launches on Apple Silicon (which refuses
      # unsigned binaries). NOTE: ad-hoc signing is enough to RUN, but not to
      # distribute past Gatekeeper — that needs a Developer ID cert + notarization
      # (set up later via secrets; see CLAUDE.md known gaps).
      - name: Codesign (macOS, ad-hoc)
        if: runner.os == 'macOS'
        run: codesign --force --sign - "dist/${{ matrix.bin }}"

      # Smoke-test the freshly built binary on its native runner.
      - name: Smoke test
        shell: bash
        run: |
          ./dist/${{ matrix.bin }} list
          ./dist/${{ matrix.bin }} prop package.json

      # Wrap the bare `s3cab[.exe]` in a per-platform archive for release: tar.gz
      # everywhere except Windows (zip, more native there). `-C dist` keeps the
      # archive flat — it contains just the binary, no `dist/` prefix.
      - name: Archive (tar.gz)
        if: runner.os != 'Windows'
        run: tar -czf "${{ matrix.archive }}" -C dist "${{ matrix.bin }}"
      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/${{ matrix.bin }}" -DestinationPath "${{ matrix.archive }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload assets
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Ship a checksums file alongside the binaries so downloads are verifiable
      # — fitting for a tool whose whole premise is SHA-256 content addressing.
      # `*` is expanded before SHA256SUMS is created, so it never hashes itself.
      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          # Mark pre-1.0 (v0.x) or semver-prerelease (v1.2.3-rc1) tags as prerelease
          # so they don't show as "Latest" in the Releases UI.
          prerelease=
          case "$tag" in
            v0.* | *-*) prerelease=--prerelease ;;
          esac
          gh release create "$tag" artifacts/* \
            --repo "${{ github.repository }}" \
            --generate-notes \
            $prerelease

  # Publish the npm package (source, not the binary — see CLAUDE.md "npm package").
  # Runs in parallel with `release`, both gated on a v* tag and on `build` passing.
  publish-npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC, so `npm publish --provenance` can attest the build
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org # sets up auth from NODE_AUTH_TOKEN

      # The git tag is the source of truth for the version; fail fast and clearly
      # if package.json disagrees (npm would otherwise reject it late, or publish
      # the wrong number). Strips the leading `v`: v0.0.1 -> 0.0.1.
      - name: Tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          test "$tag" = "$pkg" || { echo "tag v$tag != package.json $pkg" >&2; exit 1; }

      # No build/prepack: we publish the source tree (the `files` allowlist). The
      # dist-tag deliberately differs from the GitHub-release prerelease rule —
      # only a semver-prerelease tag (v1.2.3-rc1) goes to `next`; a plain v0.x
      # publishes to `latest`, so the first real release supersedes the stale
      # 0.0.0 oclif build that currently holds `latest` on npm.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*) disttag=next ;;
            *) disttag=latest ;;
          esac
          npm publish --provenance --access public --tag "$disttag"
