# Continuous integration: lint + test on every push to main and every PR.
#
# This is the gate that release.yml is NOT — releases only fire on a `v*` tag,
# so without this nothing would run on branches/PRs. Tests run across all three
# supported OSes because the code genuinely branches on platform (case-insensitive
# glob matching on win32, `\`->`/` normalization, `.exe`/zstd handling) — a
# Linux-only run never exercises those paths. Lint and the Prettier format check
# are OS-independent, so they run once on Linux rather than three times.
#
# release.yml keeps its own single-OS lint+test gate: a `v*` tag is the one commit
# this workflow does NOT cover, so the tagged build re-checks before publishing.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI never needs to write to the repo.
permissions:
  contents: read

# Supersede in-flight runs for the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match release.yml: pin to the engines floor so CI runs the version we ship on.
  NODE_VERSION: "26.3.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Coverage report (advisory — NOT a gate). Emits the coverage table so the number is
      # visible in the CI log, but it never fails the build: a percentage rewards
      # assertion-free tests (it measures execution, not verification), so coverage quality
      # is judged by review instead (CLAUDE.md working-convention #12 — the `/review` skill's
      # Standards axis and Copilot code review via .github/copilot-instructions.md). Runs
      # once here, OS-independent like lint, rather than across the matrix.
      - run: npm run test:coverage:report

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three OSes run because the code branches on platform (see the file
        # header). ubuntu-latest stays even though the lint job's coverage report also
        # runs the suite on Linux — a small double-run, but `test (ubuntu-latest)` is a
        # required status check, so dropping it leaves the branch unmergeable.
        # macos-14 is Apple Silicon; mirrors the release build targets.
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm test

  # Real-AWS integration tests: the gated S3 round-trips (backup/restore, listing,
  # verified download) that need an actual bucket. Deliberately narrow in WHERE it
  # runs — see specs/testing.md "Where real S3 runs":
  #   * same-repo PRs only (the `if` below: the source repo equals this repo). A fork
  #     PR gets no secrets/OIDC by GitHub design, so it's excluded and stays green on
  #     the mocked-seam tests instead; the real round-trip runs when a maintainer
  #     reproduces the branch in-repo. The same check also skips push-to-main and any
  #     non-PR event (no PR context ⇒ the comparison is false), so merged code gets no
  #     second credentialed run — approval happens before merge, on the PR.
  #   * behind the `s3-integration-tests` Environment, which requires reviewer
  #     approval, so nothing credentialed runs until a maintainer clicks approve — an
  #     untrusted PR can never cause spend.
  # Auth is short-lived OIDC (no stored keys): the env-scoped AWS_ROLE_ARN secret names
  # a role whose trust policy further restricts the assume to this exact environment.
  # One OS only — the S3 code path doesn't branch on platform (unlike the matrix above).
  s3-integration:
    name: s3 integration
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: s3-integration-tests
    permissions:
      id-token: write # mint the OIDC token for the AWS assume-role
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1 # the test bucket's region; exported as AWS_REGION
      - run: npm test
        env:
          S3CAB_TEST_BUCKET: ${{ vars.S3CAB_TEST_BUCKET }}
