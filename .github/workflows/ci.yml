# Continuous integration: lint + test on every push to main and every PR.
#
# This is the gate that release.yml is NOT — releases only fire on a `v*` tag,
# so without this nothing would run on branches/PRs. Tests run across all three
# supported OSes because the code genuinely branches on platform (case-insensitive
# glob matching on win32, `\`->`/` normalization, `.exe`/zstd handling) — a
# Linux-only run never exercises those paths. Lint and the Prettier format check
# are OS-independent, so they run once on Linux rather than three times.
#
# release.yml keeps its own single-OS lint+test gate: a `v*` tag is the one commit
# this workflow does NOT cover, so the tagged build re-checks before publishing.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI never needs to write to the repo.
permissions:
  contents: read

# Supersede in-flight runs for the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match release.yml: pin to the engines floor so CI runs the version we ship on.
  NODE_VERSION: "26.3.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Coverage gate. OS-independent like lint, so it runs once here rather than
      # across the matrix. The thresholds + excludes live in the `test:coverage:gate`
      # npm script so the gate reproduces locally with one command and CI stays a thin
      # caller. Thresholds are a floor, not a target — bump as coverage rises; they read
      # low on the S3-touching modules because those integration tests are gated off
      # without a bucket (see CLAUDE.md), hence a global gate, not per-file.
      - run: npm run test:coverage:gate

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is Apple Silicon; mirrors the release build targets.
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm test
