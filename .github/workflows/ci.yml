# Continuous integration: lint + test on every push to main and every PR.
#
# This is the gate that release.yml is NOT — releases only fire on a `v*` tag,
# so without this nothing would run on branches/PRs. Tests run across all three
# supported OSes because the code genuinely branches on platform (case-insensitive
# glob matching on win32, `\`->`/` normalization, `.exe`/zstd handling) — a
# Linux-only run never exercises those paths. Lint and the Prettier format check
# are OS-independent, so they run once on Linux rather than three times.
#
# release.yml keeps its own single-OS lint+test gate: a `v*` tag is the one commit
# this workflow does NOT cover, so the tagged build re-checks before publishing.
#
# WHAT GATES A MERGE: make the final job the one required status check in branch
# protection — pick it by its display NAME, `ci gate` (shown as `ci / ci gate` in the
# Checks UI), not the YAML key `ci-gate`. It passes only when every job that ran
# succeeded, so a merge can never slip in untested code — and no human decides whether
# to run the suite. (Don't mark `s3 integration` required directly: it's skipped on
# fork PRs, and a required check that gets skipped is treated as forever-pending,
# wedging those PRs.)

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: CI never writes to the repo. The s3-integration job widens
# this to mint an OIDC token.
permissions:
  contents: read

# Supersede in-flight runs for the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match release.yml: pin to the engines floor so CI runs the version we ship on.
  NODE_VERSION: "26.3.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Coverage report (advisory — NOT a gate). Emits the coverage table so the number is
      # visible in the CI log, but it never fails the build due to coverage thresholds: a
      # percentage rewards assertion-free tests (it measures execution, not verification), so
      # coverage quality is judged by review instead (CLAUDE.md working-convention #12 — the
      # `/review` skill's Standards axis and Copilot code review via .github/copilot-instructions.md). Runs
      # once here, OS-independent like lint, rather than across the matrix.
      - run: npm run test:coverage:report

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three OSes run because the code branches on platform (see the file
        # header). ubuntu-latest stays for a clean, unambiguous per-OS test signal even
        # though the lint job's coverage report also runs the suite on Linux — the small
        # double-run is worth a dedicated `test (ubuntu-latest)` result (the `ci gate`
        # job aggregates all three OSes for branch protection anyway).
        # macos-14 is Apple Silicon; mirrors the release build targets.
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - run: npm test

  # Real-AWS integration tests: the gated S3 round-trips (backup/restore, listing,
  # verified download) that need an actual bucket. Runs AUTOMATICALLY on every
  # same-repo PR before merge — no manual approval, no "should I run it?" decision —
  # which covers the day-to-day case where forgetting is the real risk. It does NOT
  # run on push-to-main (redundant: the PR already tested that commit) nor on fork
  # PRs (`if` below): GitHub gives a fork run no secrets/OIDC by design, so it
  # physically can't run; forks stay green on the mocked-seam tier. A fork PR is a
  # rare, attention-getting event — to run the real round-trip on one, reproduce its
  # commits as a branch in this repo, which makes it a same-repo PR and runs here.
  #
  # Auth is short-lived OIDC (no stored keys). The approval Environment was REMOVED
  # (auto-run), so the OIDC token's `sub` is no longer
  # `...:environment:s3-integration-tests`: the role's trust policy
  # (ci/aws/trust-policy.json) must allow this repo's `pull_request` subject instead,
  # and AWS_ROLE_ARN / S3CAB_TEST_BUCKET must be repo-level secret/var (no longer
  # Environment-scoped). Spend stays capped by the tight IAM policy + 1-day bucket
  # lifecycle + billing alarm (specs/testing.md).
  # One OS only — the S3 code path doesn't branch on platform (unlike the matrix above).
  s3-integration:
    name: s3 integration
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mint the OIDC token for the AWS assume-role
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1 # the test bucket's region; exported as AWS_REGION
      - run: npm test
        env:
          S3CAB_TEST_BUCKET: ${{ vars.S3CAB_TEST_BUCKET }}

  # The single required check. Always runs and fails if any job that ran failed (a
  # fork-skipped s3-integration is 'skipped', not 'failure', so it doesn't block).
  # Mark this job — by its display name `ci gate` — as the required status check.
  ci-gate:
    name: ci gate
    needs: [lint, test, s3-integration]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::a required CI job failed or was cancelled"
          exit 1
